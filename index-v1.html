<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reisvip — Gestão</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#16213e; --muted:#6b7280;
    --brand:#1e3a8a; --brand2:#2563eb; --accent:#0ea5e9;
    --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --border:#e5e7eb; --shadow:0 1px 3px rgba(16,33,62,.08),0 1px 2px rgba(16,33,62,.04);
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  #root{min-height:100vh}
  .app{display:flex;min-height:100vh}
  .sidebar{width:240px;background:linear-gradient(180deg,#16213e,#1e3a8a);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:30;transition:transform .25s}
  .brand{padding:22px 20px;font-size:20px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1)}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:#04263a}
  .brand small{display:block;font-size:11px;font-weight:500;opacity:.7;letter-spacing:.3px}
  .nav{flex:1;padding:12px 10px;overflow:auto}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#dbe3f4;padding:11px 14px;border-radius:9px;cursor:pointer;font-size:14px;text-align:left;margin-bottom:2px;transition:.15s}
  .nav button:hover{background:rgba(255,255,255,.08)}
  .nav button.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
  .nav .ico{width:20px;text-align:center;font-size:16px}
  .sb-foot{padding:14px 18px;font-size:11px;opacity:.6;border-top:1px solid rgba(255,255,255,.1)}
  .main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-width:0}
  .topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
  .topbar h1{font-size:19px;margin:0}
  .topbar .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .hamb{display:none;background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink)}
  .content{padding:26px;max-width:1300px;width:100%}
  .grid{display:grid;gap:18px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card.pad{padding:20px}
  .stat{display:flex;flex-direction:column;gap:6px;padding:20px;position:relative;overflow:hidden}
  .stat .lbl{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .val{font-size:27px;font-weight:800}
  .stat .ic{position:absolute;right:16px;top:16px;font-size:26px;opacity:.18}
  .stat.b{border-left:4px solid var(--brand2)}
  .stat.g{border-left:4px solid var(--green)}
  .stat.a{border-left:4px solid var(--amber)}
  .stat.c{border-left:4px solid var(--accent)}
  .section-title{font-size:16px;font-weight:700;margin:26px 0 14px}
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .toolbar .spacer{flex:1}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--ink);outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .search{max-width:300px}
  .btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn.primary{background:var(--brand2);color:#fff}
  .btn.primary:hover{background:var(--brand)}
  .btn.ghost{background:#eef2ff;color:var(--brand)}
  .btn.ghost:hover{background:#e0e7ff}
  .btn.danger{background:#fee2e2;color:var(--red)}
  .btn.danger:hover{background:#fecaca}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);font-size:13.5px}
  th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;background:#fafbfe}
  tbody tr:hover{background:#fafbff}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
  .pill.ok{background:#dcfce7;color:#15803d}
  .pill.low{background:#fef3c7;color:#b45309}
  .pill.out{background:#fee2e2;color:#b91c1c}
  .pill.in{background:#dcfce7;color:#15803d}
  .pill.outm{background:#fee2e2;color:#b91c1c}
  .empty{text-align:center;color:var(--muted);padding:46px 20px}
  .empty .big{font-size:40px;margin-bottom:8px}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .icon-btn{border:0;background:#f1f5f9;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
  .icon-btn:hover{background:#e2e8f0}
  .icon-btn.del:hover{background:#fee2e2}
  .overlay{position:fixed;inset:0;background:rgba(16,33,62,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease}
  .modal.wide{max-width:820px}
  @keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{margin:0;font-size:17px}
  .modal-body{padding:22px}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .x{cursor:pointer;font-size:22px;color:var(--muted);border:0;background:none;line-height:1}
  .chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
  .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bar{width:100%;max-width:46px;background:linear-gradient(180deg,var(--brand2),var(--accent));border-radius:6px 6px 0 0;transition:height .4s;min-height:2px}
  .bar-lbl{font-size:11px;color:var(--muted)}
  .bar-val{font-size:11px;font-weight:700}
  .two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  .activity{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
  .activity:last-child{border:0}
  .activity .dot{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
  .muted{color:var(--muted)}
  .cart-line{display:grid;grid-template-columns:1fr 80px 110px 90px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
  .totbox{background:#f8fafc;border-radius:10px;padding:14px 16px;margin-top:14px;display:flex;justify-content:space-between;font-size:18px;font-weight:800}
  .invoice{font-size:13px}
  .invoice h2{margin:0 0 4px}
  .inv-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--brand);padding-bottom:14px;margin-bottom:16px}
  @media print{.sidebar,.topbar,.modal-foot,.no-print{display:none!important}.main{margin:0}.overlay{position:static;background:none;padding:0}.modal{box-shadow:none;max-width:none}}
  @media(max-width:880px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:none}
    .main{margin-left:0}
    .hamb{display:block}
    .two-col{grid-template-columns:1fr}
    .form-grid{grid-template-columns:1fr}
    .cart-line{grid-template-columns:1fr 60px 90px 70px 30px;font-size:12px}
  }
  .backdrop-m{display:none}
  @media(max-width:880px){.backdrop-m.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState} = React;

/* ---------- Utilidades ---------- */
const STORE_KEY = "reisvip_erp_v1";
const fmtMZN = n => (Number(n)||0).toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2}) + " MT";
const fmtDate = d => new Date(d).toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtDateTime = d => new Date(d).toLocaleString("pt-PT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const monthKey = d => { const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"); };
const monthLabel = k => { const [y,m]=k.split("-"); return ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"][parseInt(m)-1]+"/"+y.slice(2); };

/* ---------- Dados iniciais (seed) ---------- */
function seed(){
  const now = Date.now(); const day = 86400000;
  const clientes = [
    {id:"c1",nome:"Maria Mondlane",email:"maria.m@email.co.mz",telefone:"+258 84 123 4567",nuit:"400123456",endereco:"Av. Julius Nyerere, 120, Maputo",criadoEm:now-40*day},
    {id:"c2",nome:"Construções Beira Lda",email:"geral@beiraconstr.co.mz",telefone:"+258 82 765 4321",nuit:"400987654",endereco:"Rua do Aeroporto, Beira",criadoEm:now-35*day},
    {id:"c3",nome:"João Sitoe",email:"joao.sitoe@email.co.mz",telefone:"+258 86 555 1212",nuit:"",endereco:"Bairro Polana Caniço, Maputo",criadoEm:now-20*day},
    {id:"c4",nome:"Farmácia Central",email:"compras@farmcentral.co.mz",telefone:"+258 84 999 0000",nuit:"400222111",endereco:"Av. 24 de Julho, Maputo",criadoEm:now-10*day},
  ];
  const produtos = [
    {id:"p1",nome:"Cimento Saco 50kg",sku:"CIM-50",categoria:"Construção",preco:560,custo:430,stock:8,minStock:15,descricao:"Cimento Portland 50kg",criadoEm:now-50*day},
    {id:"p2",nome:"Tinta Branca 20L",sku:"TIN-B20",categoria:"Construção",preco:2300,custo:1700,stock:24,minStock:10,descricao:"Tinta acrílica branca interior/exterior",criadoEm:now-50*day},
    {id:"p3",nome:"Arroz 25kg",sku:"ALI-AR25",categoria:"Alimentar",preco:1850,custo:1500,stock:40,minStock:12,descricao:"Saco de arroz 25kg",criadoEm:now-48*day},
    {id:"p4",nome:"Óleo Alimentar 5L",sku:"ALI-OL5",categoria:"Alimentar",preco:790,custo:600,stock:6,minStock:20,descricao:"Óleo vegetal 5 litros",criadoEm:now-48*day},
    {id:"p5",nome:"Cadeira Plástica",sku:"MOB-CAD",categoria:"Mobiliário",preco:450,custo:300,stock:60,minStock:15,descricao:"Cadeira de plástico empilhável",criadoEm:now-30*day},
    {id:"p6",nome:"Lâmpada LED 9W",sku:"ELE-LED9",categoria:"Eléctrico",preco:120,custo:70,stock:120,minStock:30,descricao:"Lâmpada LED E27 9W",criadoEm:now-30*day},
  ];
  const vendas = [];
  const mkItem = (p,q)=>({produtoId:p.id,nome:p.nome,sku:p.sku,preco:p.preco,qtd:q,subtotal:p.preco*q});
  const addVenda=(daysAgo,cli,items)=>{
    const its=items.map(([pi,q])=>mkItem(produtos[pi],q));
    const total=its.reduce((s,i)=>s+i.subtotal,0);
    vendas.push({id:uid(),numero:"FT 2026/"+String(vendas.length+1).padStart(4,"0"),clienteId:cli,itens:its,total,data:now-daysAgo*day});
  };
  addVenda(70,"c1",[[4,4],[5,10]]);
  addVenda(64,"c2",[[0,20],[1,3]]);
  addVenda(55,"c4",[[2,5],[3,8]]);
  addVenda(40,"c3",[[4,2],[5,4]]);
  addVenda(32,"c2",[[0,10],[3,6]]);
  addVenda(18,"c1",[[2,3],[2,2]]);
  addVenda(9,"c4",[[4,12]]);
  addVenda(3,"c3",[[5,15],[4,3]]);
  addVenda(1,"c1",[[1,2]]);
  const movimentos = [
    {id:uid(),produtoId:"p1",tipo:"entrada",qtd:50,nota:"Compra fornecedor",data:now-52*day},
    {id:uid(),produtoId:"p3",tipo:"entrada",qtd:60,nota:"Stock inicial",data:now-49*day},
    {id:uid(),produtoId:"p1",tipo:"saida",qtd:12,nota:"Ajuste / quebra",data:now-5*day},
  ];
  return {clientes,produtos,vendas,movimentos};
}

function load(){
  try{ const r=localStorage.getItem(STORE_KEY); if(r) return JSON.parse(r); }catch(e){}
  const s=seed(); localStorage.setItem(STORE_KEY,JSON.stringify(s)); return s;
}

/* ---------- Autenticação / Utilizadores ---------- */
const USERS_KEY = "reisvip_users_v1";
const SESS_KEY = "reisvip_sessao_v1";
// hash simples (não criptográfico — segurança básica para uso interno)
function hashPwd(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return "h"+h.toString(36);}
function loadUsers(){
  try{const r=localStorage.getItem(USERS_KEY);if(r){const u=JSON.parse(r);if(u && u.length)return u;}}catch(e){}
  const def=[{id:"u1",nome:"Dono",utilizador:"dono",pwd:hashPwd("reisvip123"),papel:"dono"}];
  localStorage.setItem(USERS_KEY,JSON.stringify(def));return def;
}
function saveUsers(u){localStorage.setItem(USERS_KEY,JSON.stringify(u));}
const PERMS={
  dono:["dashboard","clientes","produtos","stock","vendas","relatorios","utilizadores","definicoes"],
  funcionario:["dashboard","clientes","produtos","stock","vendas"],
};
const can=(papel,pagina)=>(PERMS[papel]||[]).includes(pagina);

/* ---------- Ecrã de Login ---------- */
function Login({onLogin}){
  const [u,setU]=useState(""); const [p,setP]=useState(""); const [err,setErr]=useState("");
  const entrar=()=>{
    const users=loadUsers();
    const found=users.find(x=>x.utilizador.toLowerCase()===u.trim().toLowerCase() && x.pwd===hashPwd(p));
    if(!found){setErr("Utilizador ou palavra-passe incorretos.");return;}
    localStorage.setItem(SESS_KEY,found.id);onLogin(found);
  };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#16213e,#1e3a8a)"}}>
      <div className="card" style={{width:"100%",maxWidth:380,padding:32}}>
        <div style={{textAlign:"center",marginBottom:22}}>
          <div style={{width:54,height:54,borderRadius:14,background:"var(--accent)",color:"#04263a",display:"inline-flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:26}}>R</div>
          <h2 style={{margin:"12px 0 2px"}}>Reisvip</h2>
          <div className="muted" style={{fontSize:13}}>Gestão Comercial</div>
        </div>
        <Field label="Utilizador"><input value={u} autoFocus onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()} placeholder="dono" /></Field>
        <Field label="Palavra-passe"><input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrar()} placeholder="••••••••" /></Field>
        {err && <div style={{color:"var(--red)",fontSize:13,marginBottom:12}}>{err}</div>}
        <button className="btn primary" style={{width:"100%",justifyContent:"center"}} onClick={entrar}>Entrar</button>
        <div className="muted" style={{fontSize:11.5,textAlign:"center",marginTop:14}}>Acesso inicial: <b>dono</b> / <b>reisvip123</b></div>
      </div>
    </div>
  );
}

/* ---------- Gestão de Utilizadores (só dono) ---------- */
function Utilizadores({me}){
  const [users,setUsers]=useState(loadUsers);
  const [edit,setEdit]=useState(null);
  const blank={nome:"",utilizador:"",papel:"funcionario",novaPwd:""};
  const [form,setForm]=useState(blank);
  const persist=u=>{saveUsers(u);setUsers(u);};
  const open=usr=>{setEdit(usr?usr.id:"new");setForm(usr?{nome:usr.nome,utilizador:usr.utilizador,papel:usr.papel,novaPwd:""}:blank);};
  const save=()=>{
    if(!form.nome.trim()||!form.utilizador.trim()){alert("Nome e utilizador são obrigatórios.");return;}
    const dup=users.find(x=>x.utilizador.toLowerCase()===form.utilizador.trim().toLowerCase() && x.id!==edit);
    if(dup){alert("Já existe um utilizador com esse nome de acesso.");return;}
    if(edit==="new"){
      if(!form.novaPwd){alert("Defina uma palavra-passe.");return;}
      persist([...users,{id:uid(),nome:form.nome,utilizador:form.utilizador.trim(),pwd:hashPwd(form.novaPwd),papel:form.papel}]);
    }else{
      persist(users.map(x=>x.id===edit?{...x,nome:form.nome,utilizador:form.utilizador.trim(),papel:form.papel,pwd:form.novaPwd?hashPwd(form.novaPwd):x.pwd}:x));
    }
    setEdit(null);
  };
  const del=usr=>{
    if(usr.id===me.id){alert("Não pode eliminar o seu próprio utilizador.");return;}
    if(usr.papel==="dono" && users.filter(x=>x.papel==="dono").length<=1){alert("Tem de existir pelo menos um dono.");return;}
    if(window.confirm("Eliminar o utilizador \""+usr.nome+"\"?")) persist(users.filter(x=>x.id!==usr.id));
  };
  return (
    <div>
      <div className="toolbar"><b style={{fontSize:15}}>Utilizadores</b><div className="spacer"></div>
        <button className="btn primary" onClick={()=>open(null)}>+ Novo Utilizador</button></div>
      <div className="card">
        <table>
          <thead><tr><th>Nome</th><th>Utilizador</th><th>Papel</th><th></th></tr></thead>
          <tbody>{users.map(usr=>(
            <tr key={usr.id}>
              <td><b>{usr.nome}</b>{usr.id===me.id && <span className="muted" style={{fontSize:11}}> (você)</span>}</td>
              <td>{usr.utilizador}</td>
              <td><span className={"pill "+(usr.papel==="dono"?"in":"low")}>{usr.papel==="dono"?"Dono":"Funcionário"}</span></td>
              <td><div className="row-actions">
                <button className="icon-btn" onClick={()=>open(usr)}>✏️</button>
                <button className="icon-btn del" onClick={()=>del(usr)}>🗑️</button>
              </div></td>
            </tr>
          ))}</tbody>
        </table>
      </div>
      {edit && <Modal title={edit==="new"?"Novo Utilizador":"Editar Utilizador"} onClose={()=>setEdit(null)}
        foot={<><button className="btn ghost" onClick={()=>setEdit(null)}>Cancelar</button><button className="btn primary" onClick={save}>Guardar</button></>}>
        <Field label="Nome *"><input value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} /></Field>
        <Field label="Nome de utilizador (acesso) *"><input value={form.utilizador} onChange={e=>setForm({...form,utilizador:e.target.value})} /></Field>
        <Field label="Papel"><select value={form.papel} onChange={e=>setForm({...form,papel:e.target.value})}>
          <option value="funcionario">Funcionário (vendas, clientes, produtos, stock)</option>
          <option value="dono">Dono (acesso total)</option>
        </select></Field>
        <Field label={edit==="new"?"Palavra-passe *":"Nova palavra-passe (deixe vazio para manter)"}><input type="password" value={form.novaPwd} onChange={e=>setForm({...form,novaPwd:e.target.value})} /></Field>
      </Modal>}
    </div>
  );
}

/* ---------- Componentes base ---------- */
function Modal({title,onClose,children,foot,wide}){
  return (
    <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className={"modal"+(wide?" wide":"")}>
        <div className="modal-head"><h3>{title}</h3><button className="x" onClick={onClose}>×</button></div>
        <div className="modal-body">{children}</div>
        {foot && <div className="modal-foot">{foot}</div>}
      </div>
    </div>
  );
}
function Field({label,children}){return <div className="field"><label>{label}</label>{children}</div>;}
function Empty({icon,text}){return <div className="empty"><div className="big">{icon}</div>{text}</div>;}
function confirmDel(msg){return window.confirm(msg);}

/* ---------- Dashboard ---------- */
function Dashboard({db,go}){
  const totalRevenue = db.vendas.reduce((s,v)=>s+v.total,0);
  const lowStock = db.produtos.filter(p=>p.stock<=p.minStock);
  const months=[];const d=new Date();
  for(let i=5;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(monthKey(m));}
  const revByMonth = months.map(k=>({k,v:db.vendas.filter(v=>monthKey(v.data)===k).reduce((s,v)=>s+v.total,0)}));
  const maxRev = Math.max(1,...revByMonth.map(r=>r.v));
  const prodSales={};
  db.vendas.forEach(v=>v.itens.forEach(it=>{prodSales[it.produtoId]=(prodSales[it.produtoId]||0)+it.qtd;}));
  const top=Object.entries(prodSales).map(([id,q])=>({p:db.produtos.find(x=>x.id===id),q})).filter(x=>x.p).sort((a,b)=>b.q-a.q).slice(0,5);
  const acts=[...db.vendas.map(v=>({t:v.data,tipo:"venda",txt:v.numero+" — "+fmtMZN(v.total),cli:db.clientes.find(c=>c.id===v.clienteId)})),
              ...db.movimentos.map(m=>({t:m.data,tipo:m.tipo,txt:((db.produtos.find(p=>p.id===m.produtoId)||{}).nome||"—")+" ("+(m.tipo==="entrada"?"+":"-")+m.qtd+")"}))]
              .sort((a,b)=>b.t-a.t).slice(0,7);
  return (
    <div>
      <div className="grid stats">
        <div className="card stat b"><span className="ic">👥</span><span className="lbl">Clientes</span><span className="val">{db.clientes.length}</span></div>
        <div className="card stat c"><span className="ic">📦</span><span className="lbl">Produtos</span><span className="val">{db.produtos.length}</span></div>
        <div className="card stat a"><span className="ic">⚠️</span><span className="lbl">Stock Baixo</span><span className="val">{lowStock.length}</span></div>
        <div className="card stat g"><span className="ic">💰</span><span className="lbl">Receita Total</span><span className="val" style={{fontSize:22}}>{fmtMZN(totalRevenue)}</span></div>
      </div>

      <div className="two-col" style={{marginTop:18}}>
        <div className="card pad">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <b>Receita (últimos 6 meses)</b><span className="muted" style={{fontSize:12}}>{db.vendas.length} vendas</span>
          </div>
          <div className="chart">
            {revByMonth.map(r=>(
              <div className="bar-wrap" key={r.k} title={fmtMZN(r.v)}>
                <span className="bar-val">{r.v>0?Math.round(r.v/1000)+"k":""}</span>
                <div className="bar" style={{height:(r.v/maxRev*100)+"%"}}></div>
                <span className="bar-lbl">{monthLabel(r.k)}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="card pad">
          <b>Top Produtos</b>
          <div style={{marginTop:12}}>
            {top.length===0 && <div className="muted">Sem dados.</div>}
            {top.map((t,i)=>(
              <div key={t.p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:"1px solid var(--border)"}}>
                <span style={{width:22,height:22,borderRadius:6,background:"#eef2ff",color:"var(--brand)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12}}>{i+1}</span>
                <span style={{flex:1}}>{t.p.nome}</span>
                <b>{t.q} un.</b>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="two-col" style={{marginTop:18}}>
        <div className="card pad">
          <b>Atividade Recente</b>
          <div style={{marginTop:8}}>
            {acts.map((a,i)=>(
              <div className="activity" key={i}>
                <div className="dot" style={{background:a.tipo==="venda"?"#dcfce7":a.tipo==="entrada"?"#e0f2fe":"#fee2e2"}}>{a.tipo==="venda"?"🧾":a.tipo==="entrada"?"⬇️":"⬆️"}</div>
                <div style={{flex:1}}>
                  <div>{a.txt}</div>
                  <div className="muted" style={{fontSize:11.5}}>{a.cli?a.cli.nome+" · ":""}{fmtDateTime(a.t)}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="card pad">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <b>Alertas de Stock</b>
            <button className="btn ghost sm" onClick={()=>go("stock")}>Ver stock</button>
          </div>
          <div style={{marginTop:10}}>
            {lowStock.length===0 && <div className="muted">Tudo em ordem ✔️</div>}
            {lowStock.map(p=>(
              <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:"1px solid var(--border)"}}>
                <span>{p.nome}</span>
                <span><span className={"pill "+(p.stock===0?"out":"low")}>{p.stock} / mín {p.minStock}</span></span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Clientes ---------- */
function Clientes({db,setDb}){
  const [q,setQ]=useState(""); const [edit,setEdit]=useState(null);
  const blank={nome:"",email:"",telefone:"",nuit:"",endereco:""};
  const [form,setForm]=useState(blank);
  const open=c=>{setEdit(c?c.id:"new");setForm(c?{...c}:blank);};
  const save=()=>{
    if(!form.nome.trim()){alert("Nome é obrigatório.");return;}
    setDb(d=>{
      let clientes;
      if(edit==="new") clientes=[{...form,id:uid(),criadoEm:Date.now()},...d.clientes];
      else clientes=d.clientes.map(c=>c.id===edit?{...c,...form}:c);
      return {...d,clientes};
    });
    setEdit(null);
  };
  const del=c=>{ if(confirmDel("Eliminar o cliente \""+c.nome+"\"?")) setDb(d=>({...d,clientes:d.clientes.filter(x=>x.id!==c.id)})); };
  const list=db.clientes.filter(c=>(c.nome+c.email+c.telefone+c.nuit).toLowerCase().includes(q.toLowerCase()));
  const vendasDe=id=>db.vendas.filter(v=>v.clienteId===id);
  return (
    <div>
      <div className="toolbar">
        <input className="search" placeholder="🔍 Pesquisar cliente..." value={q} onChange={e=>setQ(e.target.value)} />
        <div className="spacer"></div>
        <button className="btn primary" onClick={()=>open(null)}>+ Novo Cliente</button>
      </div>
      <div className="card">
        {list.length===0? <Empty icon="👥" text="Nenhum cliente encontrado." /> :
        <table>
          <thead><tr><th>Nome</th><th>Contacto</th><th>NUIT</th><th>Endereço</th><th className="num">Compras</th><th></th></tr></thead>
          <tbody>
            {list.map(c=>(
              <tr key={c.id}>
                <td><b>{c.nome}</b><div className="muted" style={{fontSize:12}}>{c.email||"—"}</div></td>
                <td>{c.telefone||"—"}</td>

                <td className="muted">{c.endereco||"—"}</td>
                <td className="num">{vendasDe(c.id).length}</td>
                <td><div className="row-actions">
                  <button className="icon-btn" title="Editar" onClick={()=>open(c)}>✏️</button>
                  <button className="icon-btn del" title="Eliminar" onClick={()=>del(c)}>🗑️</button>
                </div></td>
              </tr>
            ))}
          </tbody>
        </table>}
      </div>
      {edit && <Modal title={edit==="new"?"Novo Cliente":"Editar Cliente"} onClose={()=>setEdit(null)}
        foot={<><button className="btn ghost" onClick={()=>setEdit(null)}>Cancelar</button><button className="btn primary" onClick={save}>Guardar</button></>}>
        <Field label="Nome *"><input value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} /></Field>
        <div className="form-grid">
          <Field label="Email"><input value={form.email} onChange={e=>setForm({...form,email:e.target.value})} /></Field>
          <Field label="Telefone"><input value={form.telefone} onChange={e=>setForm({...form,telefone:e.target.value})} /></Field>
        </div>
        <Field label="NUIT"><input value={form.nuit} onChange={e=>setForm({...form,nuit:e.target.value})} /></Field>
        <Field label="Endereço"><textarea rows="2" value={form.endereco} onChange={e=>setForm({...form,endereco:e.target.value})} /></Field>
      </Modal>}
    </div>
  );
}

/* ---------- Produtos ---------- */
function Produtos({db,setDb}){
  const [q,setQ]=useState(""); const [cat,setCat]=useState(""); const [edit,setEdit]=useState(null);
  const blank={nome:"",sku:"",categoria:"",preco:"",custo:"",minStock:"",stock:"",descricao:""};
  const [form,setForm]=useState(blank);
  const cats=[...new Set(db.produtos.map(p=>p.categoria).filter(Boolean))];
  const open=p=>{setEdit(p?p.id:"new");setForm(p?{...p}:blank);};
  const save=()=>{
    if(!form.nome.trim()){alert("Nome é obrigatório.");return;}
    const clean={...form,preco:+form.preco||0,custo:+form.custo||0,minStock:+form.minStock||0,stock:+form.stock||0};
    setDb(d=>{
      let produtos;
      if(edit==="new") produtos=[{...clean,id:uid(),criadoEm:Date.now()},...d.produtos];
      else produtos=d.produtos.map(p=>p.id===edit?{...p,...clean}:p);
      return {...d,produtos};
    });
    setEdit(null);
  };
  const del=p=>{ if(confirmDel("Eliminar o produto \""+p.nome+"\"?")) setDb(d=>({...d,produtos:d.produtos.filter(x=>x.id!==p.id)})); };
  const list=db.produtos.filter(p=>(p.nome+p.sku+p.categoria).toLowerCase().includes(q.toLowerCase()) && (!cat||p.categoria===cat));
  return (
    <div>
      <div className="toolbar">
        <input className="search" placeholder="🔍 Pesquisar produto..." value={q} onChange={e=>setQ(e.target.value)} />
        <select style={{maxWidth:180}} value={cat} onChange={e=>setCat(e.target.value)}>

          {cats.map(c=><option key={c} value={c}>{c}</option>)}

        <button className="btn primary" onClick={()=>open(null)}>+ Novo Produto</button>

        {list.length===0? <Empty icon="📦" text="Nenhum produto encontrado." /> :
        <table>

          <tbody>
            {list.map(p=>(
              <tr key={p.id}>
                <td><b>{p.nome}</b><div className="muted" style={{fontSize:12}}>{p.descricao||""}</div></td>
                <td><code>{p.sku||"—"}</code></td>
                <td>{p.categoria||"—"}</td>
                <td className="num">{fmtMZN(p.preco)}</td>
                <td className="num"><span className={"pill "+(p.stock===0?"out":p.stock<=p.minStock?"low":"ok")}>{p.stock}</span></td>
                <td><div className="row-actions">
                  <button className="icon-btn" onClick={()=>open(p)}>✏️</button>

      {edit && <Modal title={edit==="new"?"Novo Produto":"Editar Produto"} onClose={()=>setEdit(null)}
        foot={<><button className="btn ghost" onClick={()=>setEdit(null)}>Cancelar</button><button className="btn primary" onClick={save}>Guardar</button></>}>
        <Field label="Nome *"><input value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} /></Field>

          <Field label={edit==="new"?"Stock inicial":"Stock atual"}><input type="number" value={form.stock} onChange={e=>setForm({...form,stock:e.target.value})} /></Field>
          <Field label="Stock mínimo (alerta)"><input type="number" value={form.minStock} onChange={e=>setForm({...form,minStock:e.target.value})} /></Field>
        </div>

/* ---------- Stock ---------- */
function Stock({db,setDb}){
  const [mov,setMov]=useState(null);
  const [form,setForm]=useState({produtoId:"",qtd:"",nota:""});
  const low=db.produtos.filter(p=>p.stock<=p.minStock);
  const open=tipo=>{setMov(tipo);setForm({produtoId:(db.produtos[0]||{}).id||"",qtd:"",nota:""});};
  const save=()=>{
    const qtd=+form.qtd; if(!form.produtoId||!qtd||qtd<=0){alert("Selecione o produto e uma quantidade válida.");return;}
    setDb(d=>{
      const produtos=d.produtos.map(p=>p.id===form.produtoId?{...p,stock:mov==="entrada"?p.stock+qtd:Math.max(0,p.stock-qtd)}:p);
      const movimentos=[{id:uid(),produtoId:form.produtoId,tipo:mov,qtd,nota:form.nota,data:Date.now()},...d.movimentos];
      return {...d,produtos,movimentos};
    });
    setMov(null);
  };
  const movs=[...db.movimentos].sort((a,b)=>b.data-a.data);
  const pn=id=>(db.produtos.find(p=>p.id===id)||{}).nome||"—";
  return (
    <div>
      <div className="toolbar">
        <b style={{fontSize:15}}>Inventário</b>
        <div className="spacer"></div>
        <button className="btn ghost" onClick={()=>open("entrada")}>⬇️ Entrada</button>
        <button className="btn ghost" onClick={()=>open("saida")}>⬆️ Saída</button>
      </div>

      {low.length>0 && <div className="card pad" style={{borderLeft:"4px solid var(--amber)",marginBottom:18}}>
        <b>⚠️ {low.length} produto(s) com stock baixo:</b> <span className="muted">{low.map(p=>p.nome+" ("+p.stock+")").join(", ")}</span>
      </div>}

      <div className="two-col">
        <div className="card">
          <div style={{padding:"14px 16px",fontWeight:700,borderBottom:"1px solid var(--border)"}}>Níveis de Stock</div>
          <table>
            <thead><tr><th>Produto</th><th className="num">Atual</th><th className="num">Mínimo</th><th>Estado</th></tr></thead>
            <tbody>
              {db.produtos.map(p=>(
                <tr key={p.id}><td>{p.nome}</td><td className="num">{p.stock}</td><td className="num">{p.minStock}</td>
                <td><span className={"pill "+(p.stock===0?"out":p.stock<=p.minStock?"low":"ok")}>{p.stock===0?"Esgotado":p.stock<=p.minStock?"Baixo":"OK"}</span></td></tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="card">
          <div style={{padding:"14px 16px",fontWeight:700,borderBottom:"1px solid var(--border)"}}>Movimentos</div>
          <div style={{maxHeight:420,overflow:"auto"}}>
          <table>
            <thead><tr><th>Produto</th><th>Tipo</th><th className="num">Qtd</th><th>Data</th></tr></thead>
            <tbody>
              {movs.length===0 && <tr><td colSpan="4"><Empty icon="📋" text="Sem movimentos." /></td></tr>}
              {movs.map(m=>(
                <tr key={m.id}><td>{pn(m.produtoId)}<div className="muted" style={{fontSize:11}}>{m.nota}</div></td>
                <td><span className={"pill "+(m.tipo==="entrada"?"in":"outm")}>{m.tipo==="entrada"?"Entrada":"Saída"}</span></td>
                <td className="num">{m.tipo==="entrada"?"+":"-"}{m.qtd}</td>
                <td className="muted">{fmtDate(m.data)}</td></tr>
              ))}
            </tbody>
          </table>
          </div>
        </div>
      </div>

      {mov && <Modal title={mov==="entrada"?"Registar Entrada de Stock":"Registar Saída de Stock"} onClose={()=>setMov(null)}
        foot={<><button className="btn ghost" onClick={()=>setMov(null)}>Cancelar</button><button className="btn primary" onClick={save}>Registar</button></>}>
        <Field label="Produto"><select value={form.produtoId} onChange={e=>setForm({...form,produtoId:e.target.value})}>
          {db.produtos.map(p=><option key={p.id} value={p.id}>{p.nome} (stock: {p.stock})</option>)}
        </select></Field>
        <Field label="Quantidade"><input type="number" value={form.qtd} onChange={e=>setForm({...form,qtd:e.target.value})} /></Field>
        <Field label="Nota / Motivo"><input value={form.nota} onChange={e=>setForm({...form,nota:e.target.value})} placeholder="Ex: compra a fornecedor, ajuste..." /></Field>
      </Modal>}
    </div>
  );
}

/* ---------- Vendas / Faturação ---------- */
function Vendas({db,setDb,me}){
  const ehDono = me && me.papel==="dono";
  const [novo,setNovo]=useState(false);
  const [clienteId,setClienteId]=useState("");
  const [cart,setCart]=useState([]);
  const [view,setView]=useState(null);
  const total=cart.reduce((s,l)=>{const p=db.produtos.find(x=>x.id===l.produtoId);return s+(p?p.preco*l.qtd:0);},0);
  const openNovo=()=>{setClienteId((db.clientes[0]||{}).id||"");setCart([]);setNovo(true);};
  const addLinha=()=>{const p=db.produtos[0];if(!p)return;setCart([...cart,{produtoId:p.id,qtd:1}]);};
  const setLinha=(i,patch)=>setCart(cart.map((l,j)=>j===i?{...l,...patch}:l));
  const rmLinha=i=>setCart(cart.filter((_,j)=>j!==i));
  const finalizar=()=>{
    if(!clienteId){alert("Selecione um cliente.");return;}
    if(cart.length===0){alert("Adicione pelo menos um produto.");return;}
    for(const l of cart){const p=db.produtos.find(x=>x.id===l.produtoId);if(l.qtd>p.stock){if(!window.confirm("Stock insuficiente de \""+p.nome+"\" (disponível "+p.stock+"). Continuar mesmo assim?"))return;}}
    setDb(d=>{
      const itens=cart.map(l=>{const p=d.produtos.find(x=>x.id===l.produtoId);return {produtoId:p.id,nome:p.nome,sku:p.sku,preco:p.preco,qtd:l.qtd,subtotal:p.preco*l.qtd};});
      const tot=itens.reduce((s,i)=>s+i.subtotal,0);
      const numero="FT 2026/"+String(d.vendas.length+1).padStart(4,"0");
      const venda={id:uid(),numero,clienteId,itens,total:tot,data:Date.now()};
      const produtos=d.produtos.map(p=>{const it=itens.find(i=>i.produtoId===p.id);return it?{...p,stock:Math.max(0,p.stock-it.qtd)}:p;});
      return {...d,vendas:[venda,...d.vendas],produtos};
    });
    setNovo(false);
  };
  const del=v=>{ if(confirmDel("Eliminar a fatura "+v.numero+"? (o stock NÃO será reposto)")) setDb(d=>({...d,vendas:d.vendas.filter(x=>x.id!==v.id)})); };
  const cn=id=>(db.clientes.find(c=>c.id===id)||{}).nome||"—";
  const vendas=[...db.vendas].sort((a,b)=>b.data-a.data);
  return (
    <div>
      <div className="toolbar"><b style={{fontSize:15}}>Vendas / Faturação</b><div className="spacer"></div>
        <button className="btn primary" onClick={openNovo}>+ Nova Venda</button></div>
      <div className="card">
        {vendas.length===0? <Empty icon="🧾" text="Ainda não há vendas registadas." /> :
        <table>
          <thead><tr><th>Fatura</th><th>Cliente</th><th>Data</th><th className="num">Itens</th><th className="num">Total</th><th></th></tr></thead>
          <tbody>
            {vendas.map(v=>(
              <tr key={v.id}>
                <td><b>{v.numero}</b></td><td>{cn(v.clienteId)}</td><td>{fmtDateTime(v.data)}</td>
                <td className="num">{v.itens.reduce((s,i)=>s+i.qtd,0)}</td><td className="num"><b>{fmtMZN(v.total)}</b></td>
                <td><div className="row-actions">
                  <button className="icon-btn" title="Ver fatura" onClick={()=>setView(v)}>👁️</button>
                  {ehDono && <button className="icon-btn del" onClick={()=>del(v)}>🗑️</button>}
                </div></td>
              </tr>
            ))}
          </tbody>
        </table>}
      </div>

      {novo && <Modal title="Nova Venda" wide onClose={()=>setNovo(false)}
        foot={<><div style={{flex:1,fontWeight:800,fontSize:17,alignSelf:"center"}}>Total: {fmtMZN(total)}</div>
          <button className="btn ghost" onClick={()=>setNovo(false)}>Cancelar</button>
          <button className="btn primary" onClick={finalizar}>Finalizar Venda</button></>}>
        <Field label="Cliente"><select value={clienteId} onChange={e=>setClienteId(e.target.value)}>
          <option value="">— Selecione —</option>
          {db.clientes.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
        </select></Field>
        <div style={{margin:"6px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <b>Produtos</b><button className="btn ghost sm" onClick={addLinha}>+ Adicionar linha</button>
        </div>
        <div className="cart-line" style={{fontWeight:700,color:"var(--muted)",fontSize:11.5,textTransform:"uppercase"}}>
          <span>Produto</span><span>Qtd</span><span>Preço</span><span>Subtotal</span><span></span>
        </div>
        {cart.length===0 && <div className="muted" style={{padding:"14px 0"}}>Nenhum produto adicionado.</div>}
        {cart.map((l,i)=>{const p=db.produtos.find(x=>x.id===l.produtoId)||{};return (
          <div className="cart-line" key={i}>
            <select value={l.produtoId} onChange={e=>setLinha(i,{produtoId:e.target.value})}>
              {db.produtos.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}
            </select>
            <input type="number" min="1" value={l.qtd} onChange={e=>setLinha(i,{qtd:Math.max(1,+e.target.value||1)})} />
            <span className="num">{fmtMZN(p.preco)}</span>
            <span className="num"><b>{fmtMZN((p.preco||0)*l.qtd)}</b></span>
            <button className="icon-btn del" onClick={()=>rmLinha(i)}>✕</button>
          </div>
        );})}
        <div className="totbox"><span>Total</span><span>{fmtMZN(total)}</span></div>
      </Modal>}

      {view && <Modal title={"Fatura "+view.numero} onClose={()=>setView(null)}
        foot={<><button className="btn ghost no-print" onClick={()=>window.print()}>🖨️ Imprimir</button><button className="btn primary" onClick={()=>setView(null)}>Fechar</button></>}>
        <div className="invoice">
          <div className="inv-head">
            <div><h2>REISVIP</h2><div className="muted">Gestão Comercial</div></div>
            <div style={{textAlign:"right"}}><b>{view.numero}</b><div className="muted">{fmtDateTime(view.data)}</div></div>
          </div>
          <div style={{marginBottom:14}}><span className="muted">Cliente:</span> <b>{cn(view.clienteId)}</b></div>
          <table>
            <thead><tr><th>Produto</th><th className="num">Qtd</th><th className="num">Preço</th><th className="num">Subtotal</th></tr></thead>
            <tbody>{view.itens.map((it,i)=><tr key={i}><td>{it.nome}<div className="muted" style={{fontSize:11}}>{it.sku}</div></td><td className="num">{it.qtd}</td><td className="num">{fmtMZN(it.preco)}</td><td className="num">{fmtMZN(it.subtotal)}</td></tr>)}</tbody>
          </table>
          <div className="totbox"><span>TOTAL</span><span>{fmtMZN(view.total)}</span></div>
          <div className="muted" style={{textAlign:"center",marginTop:16,fontSize:11}}>Obrigado pela sua preferência — Reisvip</div>
        </div>
      </Modal>}
    </div>
  );
}

/* ---------- Relatórios ---------- */
function Relatorios({db}){
  const months=[];const d=new Date();
  for(let i=11;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(monthKey(m));}
  const byMonth=months.map(k=>({k,total:db.vendas.filter(v=>monthKey(v.data)===k).reduce((s,v)=>s+v.total,0),n:db.vendas.filter(v=>monthKey(v.data)===k).length}));
  const max=Math.max(1,...byMonth.map(m=>m.total));
  const rev={};const qt={};
  db.vendas.forEach(v=>v.itens.forEach(it=>{rev[it.produtoId]=(rev[it.produtoId]||0)+it.subtotal;qt[it.produtoId]=(qt[it.produtoId]||0)+it.qtd;}));
  const topRev=Object.entries(rev).map(([id,v])=>({p:db.produtos.find(x=>x.id===id),v,q:qt[id]})).filter(x=>x.p).sort((a,b)=>b.v-a.v);
  const byCli={};db.vendas.forEach(v=>{byCli[v.clienteId]=(byCli[v.clienteId]||0)+v.total;});
  const topCli=Object.entries(byCli).map(([id,v])=>({c:db.clientes.find(x=>x.id===id),v})).filter(x=>x.c).sort((a,b)=>b.v-a.v);
  const totalRev=db.vendas.reduce((s,v)=>s+v.total,0);
  const valorStock=db.produtos.reduce((s,p)=>s+p.preco*p.stock,0);
  const exportCSV=()=>{
    let csv="Fatura,Cliente,Data,Total\n";
    db.vendas.forEach(v=>{csv+=v.numero+',"'+((db.clientes.find(c=>c.id===v.clienteId)||{}).nome||"")+'",'+fmtDate(v.data)+","+v.total+"\n";});
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="vendas_reisvip.csv";a.click();
  };
  return (
    <div>
      <div className="toolbar"><b style={{fontSize:15}}>Relatórios</b><div className="spacer"></div>
        <button className="btn ghost" onClick={exportCSV}>⬇️ Exportar vendas (CSV)</button></div>
      <div className="grid stats">
        <div className="card stat g"><span className="lbl">Receita total</span><span className="val" style={{fontSize:20}}>{fmtMZN(totalRev)}</span></div>
        <div className="card stat b"><span className="lbl">Nº de vendas</span><span className="val">{db.vendas.length}</span></div>
        <div className="card stat c"><span className="lbl">Ticket médio</span><span className="val" style={{fontSize:20}}>{fmtMZN(db.vendas.length?totalRev/db.vendas.length:0)}</span></div>
        <div className="card stat a"><span className="lbl">Valor em stock</span><span className="val" style={{fontSize:20}}>{fmtMZN(valorStock)}</span></div>
      </div>

      <div className="card pad" style={{marginTop:18}}>
        <b>Vendas por mês (12 meses)</b>
        <div className="chart" style={{height:200}}>
          {byMonth.map(m=>(
            <div className="bar-wrap" key={m.k} title={fmtMZN(m.total)+" — "+m.n+" vendas"}>
              <span className="bar-val">{m.total>0?Math.round(m.total/1000)+"k":""}</span>
              <div className="bar" style={{height:(m.total/max*100)+"%"}}></div>
              <span className="bar-lbl">{monthLabel(m.k)}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="two-col" style={{marginTop:18}}>
        <div className="card">
          <div style={{padding:"14px 16px",fontWeight:700,borderBottom:"1px solid var(--border)"}}>Produtos mais vendidos (receita)</div>
          <table><thead><tr><th>Produto</th><th className="num">Qtd</th><th className="num">Receita</th></tr></thead>
          <tbody>{topRev.length===0?<tr><td colSpan="3"><Empty icon="📊" text="Sem dados."/></td></tr>:
            topRev.map(t=><tr key={t.p.id}><td>{t.p.nome}</td><td className="num">{t.q}</td><td className="num"><b>{fmtMZN(t.v)}</b></td></tr>)}</tbody></table>
        </div>
        <div className="card">
          <div style={{padding:"14px 16px",fontWeight:700,borderBottom:"1px solid var(--border)"}}>Melhores clientes</div>
          <table><thead><tr><th>Cliente</th><th className="num">Total gasto</th></tr></thead>
          <tbody>{topCli.length===0?<tr><td colSpan="2"><Empty icon="👥" text="Sem dados."/></td></tr>:
            topCli.map(t=><tr key={t.c.id}><td>{t.c.nome}</td><td className="num"><b>{fmtMZN(t.v)}</b></td></tr>)}</tbody></table>
        </div>
      </div>
    </div>
  );
}

/* ---------- Definições ---------- */
function Definicoes(){
  const reset=()=>{ if(window.confirm("Repor os dados de exemplo? Todos os dados atuais serão APAGADOS.")){localStorage.removeItem(STORE_KEY);location.reload();} };
  const limpar=()=>{ if(window.confirm("Apagar TODOS os dados e começar do zero?")){const empty={clientes:[],produtos:[],vendas:[],movimentos:[]};localStorage.setItem(STORE_KEY,JSON.stringify(empty));location.reload();} };
  const exportar=()=>{const data=localStorage.getItem(STORE_KEY);const blob=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="reisvip_backup.json";a.click();};
  const importar=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{JSON.parse(r.result);localStorage.setItem(STORE_KEY,r.result);location.reload();}catch(err){alert("Ficheiro inválido.");}};r.readAsText(f);};
  return (
    <div className="card pad" style={{maxWidth:600}}>
      <b style={{fontSize:15}}>Dados & Backup</b>
      <p className="muted">Os dados são guardados localmente no seu navegador (localStorage). Faça backups regulares.</p>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginTop:10}}>
        <button className="btn ghost" onClick={exportar}>⬇️ Exportar backup (JSON)</button>
        <label className="btn ghost" style={{cursor:"pointer"}}>⬆️ Importar backup
          <input type="file" accept=".json" onChange={importar} style={{display:"none"}} /></label>
        <button className="btn ghost" onClick={reset}>♻️ Repor dados de exemplo</button>
        <button className="btn danger" onClick={limpar}>🗑️ Apagar todos os dados</button>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
const PAGES=[
  {k:"dashboard",label:"Painel",ic:"📊"},
  {k:"clientes",label:"Clientes",ic:"👥"},
  {k:"produtos",label:"Produtos",ic:"📦"},
  {k:"stock",label:"Stock",ic:"🏷️"},
  {k:"vendas",label:"Vendas",ic:"🧾"},
  {k:"relatorios",label:"Relatórios",ic:"📈"},
  {k:"utilizadores",label:"Utilizadores",ic:"👤"},
  {k:"definicoes",label:"Definições",ic:"⚙️"},
];
function App(){
  const [me,setMe]=useState(()=>{
    const id=localStorage.getItem(SESS_KEY);if(!id)return null;
    return loadUsers().find(u=>u.id===id)||null;
  });
  const [db,setDbState]=useState(load);
  const [page,setPage]=useState("dashboard");
  const [open,setOpen]=useState(false);
  const setDb=updater=>setDbState(prev=>{const next=typeof updater==="function"?updater(prev):updater;localStorage.setItem(STORE_KEY,JSON.stringify(next));return next;});
  const logout=()=>{localStorage.removeItem(SESS_KEY);setMe(null);setPage("dashboard");};

  if(!me) return <Login onLogin={u=>{setMe(u);setPage("dashboard");}} />;

  const pages=PAGES.filter(p=>can(me.papel,p.k));
  const safePage = can(me.papel,page)?page:"dashboard";
  const cur=pages.find(p=>p.k===safePage)||pages[0];
  const go=k=>{setPage(k);setOpen(false);};
  return (
    <div className="app">
      <div className={"backdrop-m"+(open?" show":"")} onClick={()=>setOpen(false)}></div>
      <aside className={"sidebar"+(open?" open":"")}>
        <div className="brand"><span className="logo">R</span><div>Reisvip<small>Gestão Comercial</small></div></div>
        <nav className="nav">
          {pages.map(p=><button key={p.k} className={safePage===p.k?"active":""} onClick={()=>go(p.k)}><span className="ico">{p.ic}</span>{p.label}</button>)}
        </nav>
        <div className="sb-foot">
          <div style={{marginBottom:8,color:"#dbe3f4"}}>👤 {me.nome} · <span style={{opacity:.8}}>{me.papel==="dono"?"Dono":"Funcionário"}</span></div>
          <button className="btn ghost sm" style={{width:"100%",justifyContent:"center"}} onClick={logout}>Terminar sessão</button>
          <div style={{marginTop:8}}>© 2026 Reisvip · v1.0</div>
        </div>
      </aside>
      <div className="main">
        <div className="topbar">
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <button className="hamb" onClick={()=>setOpen(!open)}>☰</button>
            <div><h1>{cur.label}</h1><div className="sub">{new Date().toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div></div>
          </div>
        </div>
        <div className="content">
          {safePage==="dashboard" && <Dashboard db={db} go={go} />}
          {safePage==="clientes" && <Clientes db={db} setDb={setDb} />}
          {safePage==="produtos" && <Produtos db={db} setDb={setDb} />}
          {safePage==="stock" && <Stock db={db} setDb={setDb} />}
          {safePage==="vendas" && <Vendas db={db} setDb={setDb} me={me} />}
          {safePage==="relatorios" && <Relatorios db={db} />}
          {safePage==="utilizadores" && <Utilizadores me={me} />}
          {safePage==="definicoes" && <Definicoes />}
        </div>
      </div>
      <datalist id="cats">{[...new Set(db.produtos.map(p=>p.categoria).filter(Boolean))].map(c=><option key={c} value={c} />)}</datalist>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
