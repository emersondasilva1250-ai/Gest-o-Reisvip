<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reisvip — Marketplace Digital</title>
<meta name="description" content="Reisvip — Marketplace de Produtos Digitais em Moçambique. Streaming, IA, Software, Chaves de Activação. +10.000 vendas. Revenda autorizada."/>
<meta name="theme-color" content="#0a0e1a"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%230f172a'/><text x='50' y='68' font-size='52' font-weight='bold' text-anchor='middle' fill='%233b82f6'>R</text></svg>"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"/>
<style>
:root{
  --bg:#06080f;--bg2:#0a0f1c;--panel:#111827;--panel2:#1a2236;--panel3:#1e293b;
  --ink:#e2e8f0;--muted:#7c8db5;--faint:#374668;--dim:#4a5980;
  --brand:#3b82f6;--brand2:#60a5fa;--brand-glow:rgba(59,130,246,.15);
  --accent:#06b6d4;--accent2:#22d3ee;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;--purple:#a855f7;--pink:#ec4899;
  --border:#1e293b;--border2:#283349;--radius:12px;
  --shadow:0 2px 8px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --glow:0 0 20px rgba(59,130,246,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--brand2);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--faint);border-radius:3px}

/* TOPBAR */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:4px 16px;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:20px;overflow:hidden}
.topbar span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.topbar strong{color:var(--green);font-weight:700}
@media(max-width:640px){.topbar{gap:10px;font-size:10px}}

/* HEADER */
.header{background:rgba(6,8,15,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.header-inner{max-width:1320px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:10px;color:#fff}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--brand),var(--accent));border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#fff;box-shadow:0 0 14px rgba(59,130,246,.3)}
.logo-sub{font-size:10px;font-weight:600;color:var(--accent2);letter-spacing:1.5px;text-transform:uppercase;margin-top:-2px}
.header-nav{display:flex;align-items:center;gap:2px}
.nav-link{padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px;transition:.2s;border:0;background:0}
.nav-link:hover,.nav-link.active{color:#fff;background:var(--panel)}
.nav-link .nav-badge{font-size:9px;padding:1px 5px;background:var(--green);color:#fff;border-radius:99px;font-weight:800;margin-left:4px}
.hdr-actions{display:flex;align-items:center;gap:6px}
.hdr-btn{background:var(--panel);border:1px solid var(--border);color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:18px;display:flex;align-items:center;justify-content:center;position:relative;transition:.2s}
.hdr-btn:hover{background:var(--panel2);border-color:var(--brand);box-shadow:var(--glow)}
.badge{position:absolute;top:1px;right:1px;background:var(--brand);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media(max-width:768px){.header-nav{display:none}}

/* SEARCH */
.search-section{background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:58px;z-index:35}
.search-inner{max-width:1320px;margin:0 auto;display:flex;gap:10px;align-items:center}
.search-wrap{flex:1;position:relative}
.search-input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--panel);color:var(--ink);outline:none;transition:.2s}
.search-input::placeholder{color:var(--faint)}
.search-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search-wrap::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px}
.filter-chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0}
.chip{flex-shrink:0;padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--panel);font-size:12px;font-weight:600;color:var(--muted);transition:.2s;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--brand);color:var(--brand2)}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* HERO */
.hero{background:linear-gradient(135deg,#06080f 0%,#0c1a3a 40%,#1e3a6e 70%,#0c1a3a 100%);padding:44px 16px 40px;position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.hero::before{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 65% 35%,rgba(59,130,246,.08) 0%,transparent 50%);pointer-events:none}
.hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--brand),transparent)}
.hero-inner{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:32px;position:relative}
.hero-text{flex:1}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hero-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700}
.hero-badge.verified{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:var(--green)}
.hero-badge.years{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:var(--amber)}
.hero h1{font-size:30px;font-weight:900;line-height:1.12;margin-bottom:10px;background:linear-gradient(135deg,#fff 30%,var(--brand2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{font-size:15px;color:var(--muted);margin-bottom:18px;max-width:480px;line-height:1.6}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap}
.hero-stat{text-align:center;padding:10px 16px;background:rgba(255,255,255,.04);border-radius:12px;border:1px solid rgba(255,255,255,.06);min-width:85px}
.hero-stat .num{font-size:22px;font-weight:900;color:#fff}
.hero-stat .lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.hero-cards{display:flex;gap:8px;flex-shrink:0}
.hero-card{width:76px;height:76px;background:var(--panel);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;transition:.3s}
.hero-card:hover{border-color:var(--brand);transform:translateY(-4px);box-shadow:var(--glow)}
.hero-card svg{width:40px;height:40px}
@media(max-width:640px){.hero h1{font-size:23px}.hero-cards{display:none}.hero-stats{gap:10px}.hero-stat{min-width:70px;padding:8px 10px}.hero-stat .num{font-size:18px}}

/* PROMO */
.promo-bar{background:linear-gradient(90deg,var(--brand),var(--purple),var(--accent));padding:10px 16px;text-align:center;font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.promo-bar a{color:#fff;text-decoration:underline}

/* PRODUCTS */
.section{max-width:1320px;margin:0 auto;padding:24px 16px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-head h2{font-size:18px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.section-head .see-all{font-size:13px;font-weight:600;color:var(--brand2);cursor:pointer}
.section-head .see-all:hover{text-decoration:underline}

.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.products{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.products{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1200px){.products{grid-template-columns:repeat(5,1fr)}}

.prod{background:var(--panel);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;transition:.25s;cursor:pointer;display:flex;flex-direction:column;position:relative}
.prod:hover{border-color:var(--brand);box-shadow:var(--glow);transform:translateY(-2px)}
.prod-top{padding:14px 12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);min-height:68px}
.prod-logo{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.prod-logo svg{width:100%;height:100%}
.prod-title-wrap{flex:1;min-width:0}
.prod-name{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-brand{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.prod-tag{padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;flex-shrink:0}
.prod-tag.hot{background:var(--red);color:#fff}
.prod-tag.new{background:var(--green);color:#fff}
.prod-tag.best{background:var(--amber);color:#000}
.prod-body{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:5px}
.prod-desc{font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.prod-meta-item{font-size:10px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:3px;background:var(--bg2);padding:3px 7px;border-radius:6px}
.prod-rating{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--amber)}
.prod-rating .cnt{font-size:11px;color:var(--muted);font-weight:500}
.prod-footer{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:6px}
.prod-price{font-size:15px;font-weight:800;color:#fff}
.prod-price small{font-size:11px;color:var(--muted);font-weight:500;display:block}
.prod-buy{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;transition:.2s;white-space:nowrap}
.prod-buy:hover{background:#2563eb;box-shadow:0 0 14px rgba(59,130,246,.3)}

/* CUSTOM ORDER BANNER */
.custom-banner{background:var(--panel);border:1px dashed var(--border2);border-radius:14px;padding:24px 20px;text-align:center;margin-top:16px}
.custom-banner h3{font-size:16px;font-weight:800;color:#fff;margin-bottom:6px}
.custom-banner p{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.custom-banner .examples{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.custom-banner .ex-tag{padding:4px 12px;border-radius:99px;background:var(--bg2);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted)}

/* RESELLER SECTION */
.reseller-section{background:linear-gradient(135deg,var(--panel) 0%,rgba(59,130,246,.04) 100%);border:1px solid var(--border);border-radius:16px;padding:32px 24px;margin:8px 0}
.reseller-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.reseller-header .r-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--brand),var(--purple));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.reseller-header h3{font-size:20px;font-weight:900;color:#fff}
.reseller-header .r-sub{font-size:13px;color:var(--muted)}

.reseller-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.r-perk{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.r-perk .r-ico{font-size:24px;flex-shrink:0;margin-top:2px}
.r-perk h4{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px}
.r-perk p{font-size:12px;color:var(--muted);line-height:1.5}

.reseller-steps{margin-bottom:24px}
.reseller-steps h4{font-size:14px;font-weight:800;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.steps-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.step-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;position:relative}
.step-num{width:32px;height:32px;background:var(--brand);color:#fff;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;margin:0 auto 10px}
.step-card h5{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px}
.step-card p{font-size:12px;color:var(--muted);line-height:1.5}

.reseller-verify{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.reseller-verify h4{font-size:14px;font-weight:800;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.verify-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:14px}
.verify-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);background:var(--panel);padding:10px 12px;border-radius:8px;border:1px solid var(--border)}
.verify-item .v-ico{font-size:16px;flex-shrink:0}
.verify-note{font-size:11px;color:var(--muted);line-height:1.6;padding:10px;background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.15);border-radius:8px}

.reseller-cta{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:640px){.reseller-section{padding:20px 16px}.reseller-header{flex-direction:column;text-align:center}.reseller-cta{justify-content:center}}

/* TRUST */
.trust-strip{background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:16px;overflow-x:auto}
.trust-strip-inner{max-width:1320px;margin:0 auto;display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.trust-item{display:flex;align-items:center;gap:8px;white-space:nowrap}
.trust-icon{width:36px;height:36px;background:var(--panel2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.trust-text .t1{font-size:13px;font-weight:700;color:#fff}
.trust-text .t2{font-size:11px;color:var(--muted)}

/* REVIEWS */
.reviews-section{max-width:1320px;margin:0 auto;padding:20px 16px}
.reviews-section h2{font-size:18px;font-weight:800;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.reviews-scroll{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.review-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:260px;max-width:300px;flex-shrink:0}
.review-card .r-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.review-card .r-avatar{width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.review-card .r-name{font-size:13px;font-weight:700;color:#fff}
.review-card .r-date{font-size:11px;color:var(--muted)}
.review-card .r-stars{color:var(--amber);font-size:13px;margin-bottom:6px}
.review-card .r-text{font-size:12px;color:var(--muted);line-height:1.6}
.review-card .r-product{font-size:11px;color:var(--brand2);font-weight:600;margin-top:6px}

/* BUTTONS */
.btn{border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:#2563eb;box-shadow:0 0 16px rgba(59,130,246,.3)}
.btn-whatsapp{background:#25d366;color:#fff}
.btn-whatsapp:hover{background:#1da851}
.btn-outline{background:transparent;color:var(--brand2);border:1.5px solid var(--brand)}
.btn-outline:hover{background:rgba(59,130,246,.1)}
.btn-ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--faint)}
.btn-sm{padding:7px 12px;font-size:12px}
.btn-lg{padding:13px 22px;font-size:15px}

/* CART */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;opacity:0;visibility:hidden;transition:.25s;backdrop-filter:blur(4px)}
.cart-overlay.open{opacity:1;visibility:visible}
.cart-drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;background:var(--bg2);z-index:51;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.cart-drawer.open{transform:none}
.cart-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--panel)}
.cart-head h2{font-size:16px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.cart-close{background:none;border:0;font-size:22px;color:var(--muted);padding:4px}
.cart-close:hover{color:var(--red)}
.cart-body{flex:1;overflow-y:auto;padding:12px 16px}
.cart-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.cart-empty .big{font-size:52px;margin-bottom:12px}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.ci-logo{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;background:var(--panel2)}
.ci-logo svg{width:28px;height:28px}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-sub{font-size:11px;color:var(--muted)}
.ci-price{font-size:14px;font-weight:800;color:var(--brand2);margin-top:4px}
.ci-qty{display:flex;align-items:center;gap:0;margin-top:6px}
.qty-btn{width:28px;height:28px;border:1px solid var(--border);background:var(--panel);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.qty-btn:first-child{border-radius:6px 0 0 6px}
.qty-btn:last-child{border-radius:0 6px 6px 0}
.qty-btn:hover{background:var(--panel2);border-color:var(--brand)}
.qty-val{width:34px;height:28px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;background:var(--panel);color:#fff}
.ci-del{background:none;border:0;font-size:16px;color:var(--muted);padding:4px;cursor:pointer;flex-shrink:0}
.ci-del:hover{color:var(--red)}
.cart-foot{padding:16px 20px;border-top:1px solid var(--border);background:var(--panel)}
.cart-total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin-bottom:14px;color:#fff}
.cart-btns{display:flex;flex-direction:column;gap:8px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.2s;backdrop-filter:blur(4px)}
.modal-overlay.open{opacity:1;visibility:visible}
@media(min-width:640px){.modal-overlay{align-items:center;padding:20px}}
.modal{background:var(--bg2);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease;border:1px solid var(--border)}
@media(min-width:640px){.modal{border-radius:18px}}
@keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.modal-header{padding:20px;display:flex;gap:16px;align-items:flex-start;border-bottom:1px solid var(--border)}
.modal-logo{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.modal-logo svg{width:100%;height:100%}
.modal-head-text{flex:1;min-width:0}
.modal-cat{font-size:11px;color:var(--accent2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.modal-name{font-size:20px;font-weight:800;color:#fff;margin-top:2px}

var currentLang = "pt";
var langDropdownOpen = false;

function detectLanguage(){
  try {
    var saved = localStorage.getItem("reisvip_lang");
    if(saved && LANGS[saved]) return saved;
    var nav = (navigator.language || navigator.userLanguage || "pt").toLowerCase();
    if(nav.startsWith("en")) return "en";
    if(nav.startsWith("es")) return "es";
  } catch(e){}
  return "pt";
}
currentLang = detectLanguage();

function t(key){
  if(T[key] && T[key][currentLang]) return T[key][currentLang];
  if(T[key] && T[key].pt) return T[key].pt;
  return key;
}

function setLang(lang){
  if(!LANGS[lang]) return;
  currentLang = lang;
  langDropdownOpen = false;
  try { localStorage.setItem("reisvip_lang", lang); } catch(e){}
  render();
}

function fmtMT(n){ return (Number(n)||0).toLocaleString("pt-PT",{minimumFractionDigits:0,maximumFractionDigits:0})+" MT"; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function brandSvg(key){ return BRAND_SVGS[key]||'<svg viewBox="0 0 44 44"><rect width="44" height="44" rx="10" fill="#334155"/><text x="22" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#94a3b8" font-family="Inter,sans-serif">?</text></svg>'; }
function starsHtml(r){ var full=Math.floor(r),half=r%1>=.5?1:0,s="";for(var i=0;i<full;i++)s+="★";if(half)s+="★";return s; }
function getSelectedPlan(p){ var idx=S.selectedPlan[p.id]||0; return p.plans[idx]||p.plans[0]; }
function cartCount(){ return S.cart.reduce(function(s,i){return s+i.qty;},0); }
function cartTotal(){ return S.cart.reduce(function(s,i){return s+i.preco*i.qty;},0); }

function addToCart(prodId, qty){
  var p = PRODUTOS.find(function(x){return x.id===prodId;});
  if(!p) return;
  qty = qty || 1;
  var plan = getSelectedPlan(p);
  var key = prodId+"_"+plan.dur;
  var existing = S.cart.find(function(c){return c.key===key;});
  if(existing){
    var newQty = existing.qty + qty;
    if(newQty > p.stock && p.stock < 9999){ showToast("Stock insuficiente!","⚠️"); return; }
    existing.qty = newQty;
  } else {
    if(qty > p.stock && p.stock < 9999){ showToast("Sem stock!","⚠️"); return; }
    S.cart.push({key:key,id:p.id,nome:p.nome+" ("+plan.dur+")",logo:p.logo,categoria:p.categoria,preco:plan.preco,qty:qty,stock:p.stock});
  }
  saveCart();
  showToast("Adicionado ao carrinho!","✅");
  render();
}

function updateQty(key, delta){
  var item = S.cart.find(function(c){return c.key===key;});
  if(!item) return;
  var nq = item.qty + delta;
  if(nq < 1){ removeFromCart(key); return; }
  if(nq > item.stock && item.stock < 9999){ showToast("Stock máximo","⚠️"); return; }
  item.qty = nq;
  saveCart();
  render();
}

function removeFromCart(key){
  S.cart = S.cart.filter(function(c){return c.key!==key;});
  saveCart();
  render();
}

function clearCart(){ S.cart=[]; saveCart(); }
function saveCart(){ try{localStorage.setItem("reisvip_cart",JSON.stringify(S.cart));}catch(e){} }
function loadCart(){ try{var r=localStorage.getItem("reisvip_cart");if(r)S.cart=JSON.parse(r);}catch(e){} }

function showToast(msg,icon){
  S.toast={msg:msg,icon:icon||"✅"};
  render();
  clearTimeout(S.toastTimer);
  setTimeout(function(){ var t=document.querySelector(".toast"); if(t) t.classList.add("show"); },10);
  S.toastTimer = setTimeout(function(){
    var t=document.querySelector(".toast");
    if(t) t.classList.remove("show");
    setTimeout(function(){ S.toast=null; },300);
  },2200);
}

function filteredProducts(){
  var list = PRODUTOS;
  if(S.category !== "Todos"){

    list = list.filter(function(p){

    });

}

function buildWhatsAppMsg(){
  var lines = ["*🛒 Pedido Reisvip*\n"];
  S.cart.forEach(function(item,i){
    lines.push((i+1)+". "+item.nome+" x"+item.qty+" — "+fmtMT(item.preco*item.qty));
  });
  lines.push("\n*Total: "+fmtMT(cartTotal())+"*");
  if(S.checkout){
    lines.push("\n*Cliente:*");
    if(S.checkout.nome) lines.push("Nome: "+S.checkout.nome);
    if(S.checkout.telefone) lines.push("Tel: "+S.checkout.telefone);
    if(S.checkout.email) lines.push("Email: "+S.checkout.email);
    if(S.checkout.pagamento) lines.push("Pagamento: "+S.checkout.pagamento);
    if(S.checkout.nota) lines.push("Nota: "+S.checkout.nota);
  }
  return encodeURIComponent(lines.join("\n"));
}

function renderProductModal(){
  if(!S.productModal) return '';
  var p = PRODUTOS.find(function(x){return x.id===S.productModal;});
  if(!p) return '';
  var planIdx = S.selectedPlan[p.id]||0;
  var plan = p.plans[planIdx]||p.plans[0];
  var stockHtml='';
  if(p.stock>=9999) stockHtml='<span class="ok">⚡ Activação imediata disponível</span>';
  else if(p.stock>10) stockHtml='<span class="ok">✓ Em stock ('+p.stock+' un.)</span>';
  else if(p.stock>0) stockHtml='<span class="low">⚠ Últimas '+p.stock+' unidades!</span>';
  else stockHtml='<span class="out">✗ Esgotado</span>';

  var plansHtml='';
  if(p.plans.length>1){
    plansHtml='<div class="modal-plans"><h4>Escolha o plano</h4><div class="plan-opts">';
    p.plans.forEach(function(pl,i){
      plansHtml+='<div class="plan-opt'+(i===planIdx?' selected':'')+'" data-plan-select="'+i+'">'+
        '<div class="dur">'+esc(pl.dur)+'</div>'+
        '<div class="pprice">'+fmtMT(pl.preco)+'</div>'+
        (pl.save?'<div class="save">-'+esc(pl.save)+'</div>':'')+
      '</div>';
    });
    plansHtml+='</div></div>';
  }

  var featsHtml='';
  if(p.features && p.features.length){
    featsHtml='<div class="modal-features">';
    p.features.forEach(function(f){
      featsHtml+='<div class="modal-feat">✓ '+esc(f)+'</div>';
    });
    featsHtml+='</div>';
  }

  return '<div class="modal-overlay open" data-act="closeProduct">'+
    '<div class="modal" onclick="event.stopPropagation()">'+
      '<div class="modal-header">'+
        '<div class="modal-logo">'+brandSvg(p.logo)+'</div>'+
        '<div class="modal-head-text">'+
          '<div class="modal-cat">'+esc(p.categoria)+'</div>'+
          '<div class="modal-name">'+esc(p.nome)+'</div>'+
          '<div class="modal-brand">'+esc(p.brand)+' · '+t("vendedorVerificado")+' ✅</div>'+
        '</div>'+
        '<button class="modal-close" data-act="closeProduct">✕</button>'+
      '</div>'+
      '<div class="modal-body">'+
        '<div class="modal-rating"><span class="stars">'+starsHtml(p.rating)+'</span> <strong>'+p.rating+'</strong> <span class="cnt">('+p.sold.toLocaleString()+' '+t("vendidos")+')</span></div>'+
        '<div class="modal-desc">'+esc(p.descricao)+'</div>'+
        featsHtml+
        plansHtml+
        '<div style="font-size:24px;font-weight:800;color:#fff;margin-bottom:12px">'+fmtMT(plan.preco)+' <span style="font-size:13px;font-weight:500;color:var(--muted)">/'+esc(plan.dur)+'</span></div>'+
        '<div class="modal-stock">'+stockHtml+'</div>'+
        '<div class="modal-qty">'+
          '<label>'+t("quantidade")+'</label>'+
          '<div class="ci-qty">'+
            '<button class="qty-btn" data-modal-qty="-1">−</button>'+
            '<div class="qty-val" id="modalQty">1</div>'+
            '<button class="qty-btn" data-modal-qty="1">+</button>'+
          '</div>'+
        '</div>'+
        '<div class="modal-btns">'+
          (p.stock>0?'<button class="btn btn-primary btn-lg" style="width:100%" data-modal-add="'+esc(p.id)+'">🛒 '+t("adicionarCarrinho")+'</button>':
          '<button class="btn btn-ghost btn-lg" style="width:100%" disabled>'+t("produtoEsgotado")+'</button>')+
          '<button class="btn btn-whatsapp" style="width:100%" data-modal-whatsapp="'+esc(p.id)+'">💬 '+t("perguntarWA")+'</button>'+

      '<p>O presente contrato regula a prestação de serviços digitais pela Reisvip, incluindo a venda de subscrições, licenças de software, chaves de activação, cartões virtuais e serviços complementares (criação de CVs, design gráfico, assistência jurídica e consultoria de negócios), através do website reisvip.shop e canais de atendimento associados.</p>'+
      '<h4>Cláusula 2.ª — Identificação das Partes</h4>'+
      '<p><strong>Prestador:</strong> Reisvip — Marketplace Digital, com sede em Moçambique, operando sob o domínio reisvip.shop, contactável através do WhatsApp (+258 87 647 9153) e email (Reisvip.shop@gmail.com).</p>'+
      '<p><strong>Cliente:</strong> Qualquer pessoa singular ou colectiva que adquira produtos ou serviços através da plataforma Reisvip.</p>'+
      '<h4>Cláusula 3.ª — Produtos e Serviços</h4>'+
      '<p>A Reisvip comercializa produtos digitais de terceiros (Netflix, Spotify, Disney+, YouTube Premium, ChatGPT, Canva, Adobe, etc.), chaves de activação de software, cartões virtuais internacionais e serviços profissionais. Os produtos são entregues digitalmente após confirmação do pagamento.</p>'+
      '<h4>Cláusula 4.ª — Preços e Pagamento</h4>'+
      '<p>Os preços são apresentados em Meticais (MT) e podem ser actualizados sem aviso prévio. O pagamento é efectuado via M-Pesa, e-Mola, transferência bancária, PayPal ou Binance, conforme indicado no acto da compra. A confirmação do pagamento é obrigatória para processamento da encomenda.</p>'+
      '<h4>Cláusula 5.ª — Entrega</h4>'+
      '<p>Os produtos digitais são entregues em até 24 horas após confirmação do pagamento, sendo que a maioria é entregue em minutos. A entrega é feita por WhatsApp ou email, conforme preferência do cliente.</p>'+
      '<h4>Cláusula 6.ª — Garantia de Activação</h4>'+
      '<p>A Reisvip garante a activação funcional de todos os produtos vendidos. Caso o produto não funcione conforme descrito, o cliente tem direito a substituição gratuita ou reembolso integral no prazo de 48 horas após a entrega.</p>'+
      '<h4>Cláusula 7.ª — Política de Reembolso</h4>'+
      '<p>O reembolso é aplicável quando: (a) o produto entregue não corresponde ao adquirido; (b) a activação falha por motivo imputável ao prestador; (c) o cliente solicita cancelamento antes da entrega. Não há reembolso após utilização efectiva do produto.</p>'+
      '<h4>Cláusula 8.ª — Contas Compartilhadas</h4>'+
      '<p>Para produtos em modalidade "Compartilhada", o cliente partilha o acesso com outros utilizadores. A Reisvip não se responsabiliza por alterações de senha feitas por terceiros, garantindo substituição imediata nestes casos.</p>'+
      '<h4>Cláusula 9.ª — Contas Privadas</h4>'+
      '<p>Os produtos em modalidade "Privada" são de uso exclusivo do cliente. A alteração de dados da conta (email, senha) é da responsabilidade do cliente após a entrega.</p>'+
      '<h4>Cláusula 10.ª — Duração e Renovação</h4>'+
      '<p>As subscrições têm duração definida no plano adquirido. A renovação não é automática, cabendo ao cliente solicitar a renovação antes do vencimento. A Reisvip envia lembretes de vencimento por WhatsApp.</p>'+
      '<h4>Cláusula 11.ª — Programa de Revenda</h4>'+
      '<p>O programa de revenda permite a comercialização de produtos Reisvip por revendedores autorizados, com preços diferenciados e comissões sobre vendas. A candidatura está sujeita a verificação de identidade e aprovação.</p>'+
      '<h4>Cláusula 12.ª — Obrigações do Revendedor</h4>'+
      '<p>O revendedor compromete-se a: (a) não revender abaixo do preço mínimo estipulado; (b) prestar informação verdadeira aos clientes; (c) encaminhar reclamações para a equipa Reisvip; (d) manter confidenciais os dados de acesso ao painel de revendedor.</p>'+
      '<h4>Cláusula 13.ª — Propriedade Intelectual</h4>'+
      '<p>Todos os conteúdos do website (textos, imagens, logótipos, design) são propriedade da Reisvip ou dos respectivos titulares de marca. É proibida a reprodução sem autorização expressa.</p>'+
      '<h4>Cláusula 14.ª — Protecção de Dados</h4>'+
      '<p>A Reisvip recolhe dados pessoais estritamente necessários para o processamento de encomendas e comunicação com o cliente. Os dados não são partilhados com terceiros, excepto quando necessário para a prestação do serviço.</p>'+
      '<h4>Cláusula 15.ª — Limitação de Responsabilidade</h4>'+
      '<p>A Reisvip não se responsabiliza por: (a) bloqueios de conta por violação dos termos do provedor original; (b) interrupções de serviço por parte dos provedores; (c) uso indevido dos produtos adquiridos pelo cliente.</p>'+
      '<h4>Cláusula 16.ª — Cartões Virtuais</h4>'+
      '<p>Os cartões virtuais internacionais são instrumentos de pagamento de uso único ou recarregável. A Reisvip não se responsabiliza por transacções recusadas por incompatibilidade com o comerciante ou por saldo insuficiente.</p>'+
      '<h4>Cláusula 17.ª — Serviços Profissionais</h4>'+
      '<p>Os serviços de criação de CVs, design gráfico, assistência jurídica e consultoria de negócios são prestados mediante orçamento prévio e acordo entre as partes. Os prazos de entrega variam conforme a complexidade do serviço.</p>'+
      '<h4>Cláusula 18.ª — Comunicação</h4>'+
      '<p>Toda comunicação oficial entre a Reisvip e o cliente é feita via WhatsApp (+258 87 647 9153), email (Reisvip.shop@gmail.com) ou telefone (+258 85 551 9407). Mensagens enviadas por outros canais não têm validade contratual.</p>'+
      '<h4>Cláusula 19.ª — Alterações ao Contrato</h4>'+
      '<p>A Reisvip reserva-se o direito de alterar os presentes termos a qualquer momento. As alterações entram em vigor após publicação no website. A continuação do uso da plataforma implica aceitação dos termos actualizados.</p>'+
      '<h4>Cláusula 20.ª — Resolução de Litígios</h4>'+
      '<p>Em caso de litígio, as partes comprometem-se a recorrer primeiro à negociação directa. Persistindo o desacordo, será competente o tribunal da comarca de Maputo, Moçambique.</p>'+
      '<h4>Cláusula 21.ª — Produtos Sob Encomenda</h4>'+
      '<p>A Reisvip disponibiliza produtos não listados no catálogo mediante encomenda especial. Estes produtos estão sujeitos a disponibilidade, preços e prazos de entrega específicos, comunicados ao cliente antes da confirmação da compra.</p>'+
      '<h4>Cláusula 22.ª — Disposições Finais</h4>'+
      '<p>O presente contrato é regido pela legislação moçambicana. Os casos omissos serão resolvidos de acordo com os princípios gerais do direito e a boa-fé contratual. A nulidade de qualquer cláusula não afecta a validade das restantes.</p>'+
    '</div></div>'+
    '<div class="modal-footer">'+
      '<button class="btn btn-primary" data-act="closeTerms">'+t("fecharTermos")+'</button>'+
    '</div>'+
  '</div></div>';
}

var modalQty = 1;

function bindEvents(){
  document.querySelectorAll("[data-act]").forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      e.preventDefault();
      var act = el.getAttribute("data-act");
      if(act==="toggleLang"){ langDropdownOpen=!langDropdownOpen; render(); return; }
      if(act==="openCart"){ S.cartOpen=true; render(); }
      else if(act==="closeCart"){ S.cartOpen=false; render(); }
      else if(act==="closeProduct"){ S.productModal=null; modalQty=1; render(); }
      else if(act==="closeCheckout"){ S.checkout=null; render(); }
      else if(act==="closeReseller"){ S.resellerModal=false; render(); }
      else if(act==="openResellerModal"){ S.resellerModal=true; render(); }
      else if(act==="openTerms"){ S.termsModal=true; render(); }
      else if(act==="closeTerms"){ S.termsModal=false; render(); }
      else if(act==="scrollServices"){ var svc=document.getElementById("servicesSection"); if(svc) svc.scrollIntoView({behavior:"smooth"}); }
      else if(act==="checkout"){ S.checkout={step:"form",nome:"",telefone:"",email:"",nota:"",pagamento:"mpesa"}; render(); }
      else if(act==="scrollTop"){ window.scrollTo({top:0,behavior:"smooth"}); }
      else if(act==="scrollReseller"){ var el2=document.getElementById("resellerSection"); if(el2) el2.scrollIntoView({behavior:"smooth"}); }
      else if(act==="whatsappSupport"){ window.open("https://wa.me/"+CONFIG.whatsapp.replace(/[^0-9]/g,""),"_blank"); }
      else if(act==="whatsappDirect"){
        S.checkout={nome:"",telefone:"",pagamento:"whatsapp"};
        window.open("https://wa.me/"+CONFIG.whatsapp.replace(/[^0-9]/g,"")+"?text="+buildWhatsAppMsg(),"_blank");
        S.checkout=null;
      }
      else if(act==="whatsappOrder"){
        window.open("https://wa.me/"+CONFIG.whatsapp.replace(/[^0-9]/g,"")+"?text="+buildWhatsAppMsg(),"_blank");
      }
      else if(act==="submitOrder"){
        var nome = document.getElementById("ckNome").value.trim();
        var tel = document.getElementById("ckTel").value.trim();
        if(!nome||!tel){ showToast(t("preenchaNomeTel"),"⚠️"); return; }
        S.checkout.nome=nome;
        S.checkout.telefone=tel;
        S.checkout.email=(document.getElementById("ckEmail").value||"").trim();
        S.checkout.nota=(document.getElementById("ckNota").value||"").trim();
        S.checkout.orderNum = "RV-"+Date.now().toString(36).toUpperCase();
        S.checkout.step="success";
        clearCart();
        render();
      }
      else if(act==="submitReseller"){
        var rfNome=(document.getElementById("rfNome").value||"").trim();
        var rfBI=(document.getElementById("rfBI").value||"").trim();
        var rfTel=(document.getElementById("rfTel").value||"").trim();
        var rfEmail=(document.getElementById("rfEmail").value||"").trim();
        var rfProv=(document.getElementById("rfProv").value||"").trim();
        var rfMorada=(document.getElementById("rfMorada").value||"").trim();
        var rfPayMethod=(document.getElementById("rfPayMethod").value||"").trim();
        var rfPayNum=(document.getElementById("rfPayNum").value||"").trim();
        var rfTerms=document.getElementById("rfTerms").checked;
        var rfBICheck=document.getElementById("rfBI_check").checked;
        if(!rfNome||!rfBI||!rfTel||!rfEmail||!rfProv||!rfMorada){
          showToast("Preencha todos os campos obrigatórios!","⚠️"); return;
        }
        if(!rfPayMethod||!rfPayNum){
          showToast("Preencha os dados de pagamento!","⚠️"); return;
        }
        if(!rfTerms||!rfBICheck){
          showToast("Aceite os termos e autorização!","⚠️"); return;
        }
        var msg = "*📋 CANDIDATURA A REVENDEDOR REISVIP*\n\n"+
          "*Dados Pessoais:*\n"+
          "Nome: "+rfNome+"\n"+
          "BI: "+rfBI+"\n"+
          "Nascimento: "+(document.getElementById("rfNasc").value||"N/D")+"\n\n"+
          "*Contacto:*\n"+
          "Tel: "+rfTel+"\n"+
          "Email: "+rfEmail+"\n"+
          "Província: "+rfProv+"\n"+
          "Morada: "+rfMorada+"\n\n"+
          "*Pagamento:*\n"+
          "Método: "+rfPayMethod+"\n"+
          "Número: "+rfPayNum+"\n\n"+
          "✅ Termos aceites\n"+
          "✅ Autorização de dados aceite";
        window.open("https://wa.me/"+CONFIG.whatsapp.replace(/[^0-9]/g,"")+"?text="+encodeURIComponent(msg),"_blank");
        S.resellerModal=false;
        showToast("Candidatura enviada! Verificaremos em até 48h.","🎉");
        render();
      }
    };
  });

  document.querySelectorAll("[data-cat]").forEach(function(el){
    el.onclick = function(){ S.category = el.getAttribute("data-cat"); S.search=""; window.scrollTo({top:0}); render(); };
  });
  document.querySelectorAll("[data-fcat]").forEach(function(el){
    el.onclick = function(e){ e.preventDefault(); S.category = el.getAttribute("data-fcat"); S.search=""; window.scrollTo({top:0,behavior:"smooth"}); render(); };
  });

  document.querySelectorAll("[data-add]").forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); addToCart(el.getAttribute("data-add")); };
  });

  document.querySelectorAll("[data-prod]").forEach(function(el){
    el.onclick = function(){ S.productModal = el.getAttribute("data-prod"); modalQty=1; render(); };
  });

  document.querySelectorAll("[data-qty-minus]").forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); updateQty(el.getAttribute("data-qty-minus"),-1); };
  });
  document.querySelectorAll("[data-qty-plus]").forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); updateQty(el.getAttribute("data-qty-plus"),1); };
  });
  document.querySelectorAll("[data-cart-del]").forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); removeFromCart(el.getAttribute("data-cart-del")); };
  });

  document.querySelectorAll("[data-plan-select]").forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      if(!S.productModal) return;
      S.selectedPlan[S.productModal] = parseInt(el.getAttribute("data-plan-select"));
      render();
    };
  });

  document.querySelectorAll("[data-modal-qty]").forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      modalQty += parseInt(el.getAttribute("data-modal-qty"));
      if(modalQty<1) modalQty=1;
      var p = PRODUTOS.find(function(x){return x.id===S.productModal;});
      if(p && p.stock<9999 && modalQty>p.stock) modalQty=p.stock;
      var valEl = document.getElementById("modalQty");
      if(valEl) valEl.textContent = modalQty;
    };
  });

  document.querySelectorAll("[data-modal-add]").forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); addToCart(el.getAttribute("data-modal-add"),modalQty); S.productModal=null; modalQty=1; S.cartOpen=true; render(); };
  });

  document.querySelectorAll("[data-modal-whatsapp]").forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      var p = PRODUTOS.find(function(x){return x.id===el.getAttribute("data-modal-whatsapp");});
      if(!p) return;
      var plan = getSelectedPlan(p);
      var msg = encodeURIComponent("Olá! Estou interessado em: *"+p.nome+" ("+plan.dur+")*  — "+fmtMT(plan.preco)+". Está disponível?");
      window.open("https://wa.me/"+CONFIG.whatsapp.replace(/[^0-9]/g,"")+"?text="+msg,"_blank");
    };
  });

  document.querySelectorAll("[data-pay]").forEach(function(el){
    el.onclick = function(){ if(S.checkout) S.checkout.pagamento=el.getAttribute("data-pay"); render(); };
  });

  document.querySelectorAll("[data-lang]").forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); setLang(el.getAttribute("data-lang")); };
  });

  document.addEventListener("click",function(e){
    if(langDropdownOpen && !e.target.closest(".lang-switch")){ langDropdownOpen=false; render(); }
  },{once:true});

  document.querySelectorAll("[data-nav]").forEach(function(el){
    el.onclick = function(){
      var nav = el.getAttribute("data-nav");
      if(nav==="revenda"){ var el2=document.getElementById("resellerSection"); if(el2) el2.scrollIntoView({behavior:"smooth"}); }
      else { window.scrollTo({top:0,behavior:"smooth"}); }
    };
  });

  var searchInput = document.querySelector("[data-input='search']");
  if(searchInput){
    searchInput.oninput = function(){ S.search = searchInput.value; render(); searchInput.focus(); };
    if(document.activeElement && document.activeElement.getAttribute("data-input")==="search"){
      searchInput.focus();
      searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
    }
  }
}

  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  h+='<div><label style="font-size:12px;color:var(--text2)">Nome</label><input id="adm-nome" value="'+esc(ep?ep.nome:"")+'" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1);box-sizing:border-box" placeholder="Ex: Netflix Premium"></div>';
  h+='<div><label style="font-size:12px;color:var(--text2)">Marca</label><input id="adm-brand" value="'+esc(ep?ep.brand:"")+'" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1);box-sizing:border-box" placeholder="Ex: Netflix"></div>';
  h+='<div><label style="font-size:12px;color:var(--text2)">Categoria</label><select id="adm-cat" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1);box-sizing:border-box">';
  cats.forEach(function(c){h+='<option value="'+esc(c)+'"'+(ep&&ep.categoria===c?' selected':'')+'>'+esc(c)+'</option>';});
  h+='<option value="__new__">+ Nova categoria...</option></select></div>';
  h+='<div><label style="font-size:12px;color:var(--text2)">Logo (ícone)</label><select id="adm-logo" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1);box-sizing:border-box">';
  logos.forEach(function(l){h+='<option value="'+l+'"'+(ep&&ep.logo===l?' selected':'')+'>'+l+'</option>';});
  h+='</select></div>';
  h+='<div><label style="font-size:12px;color:var(--text2)">Stock</label><input id="adm-stock" type="number" value="'+(ep?ep.stock:9999)+'" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1);box-sizing:border-box"></div>';
  h+='<div><label style="font-size:12px;color:var(--text2)">Tag (hot/new/best ou vazio)</label><input id="adm-tag" value="'+esc(ep?ep.tag:"")+'" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1);box-sizing:border-box" placeholder="hot, new, best"></div>';
  h+='</div>';
  h+='<div style="margin-top:10px"><label style="font-size:12px;color:var(--text2)">Descrição</label><textarea id="adm-desc" rows="2" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1);box-sizing:border-box;resize:vertical">'+(ep?esc(ep.descricao):"")+'</textarea></div>';
  h+='<div style="margin-top:10px"><label style="font-size:12px;color:var(--text2)">Features (separadas por vírgula)</label><input id="adm-feat" value="'+esc(ep?ep.features.join(", "):"")+'" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1);box-sizing:border-box" placeholder="Ex: 4K, Downloads, Perfis"></div>';
  // Plans
  h+='<div style="margin-top:12px"><label style="font-size:12px;color:var(--text2)">Planos (nome + preço). Adicione quantos quiser:</label>';
  h+='<div id="adm-plans">';
  var plans=ep?ep.plans:[{dur:"",preco:""}];
  plans.forEach(function(pl,i){
    h+='<div style="display:flex;gap:8px;margin-top:6px;align-items:center" class="adm-plan-row"><input class="adm-plan-dur" value="'+esc(pl.dur)+'" placeholder="Nome (ex: Mensal, Privada 4K)" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1)"><input class="adm-plan-preco" type="number" value="'+(pl.preco||"")+'" placeholder="Preço MT" style="width:100px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1)"><button onclick="this.parentElement.remove();" style="background:#ef4444;color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:16px">✕</button></div>';
  });
  h+='</div>';
  h+='<button onclick="addPlanRow()" style="margin-top:6px;background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px">+ Plano</button>';
  h+='</div>';
  h+='<div style="margin-top:16px;display:flex;gap:10px">';
  h+='<button onclick="saveAdminProduct()" style="background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:10px 24px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px">'+(ep?"Guardar Alterações":"Adicionar Produto")+'</button>';
  if(ep) h+='<button onclick="S.editProduct=null;render();" style="background:var(--card);color:var(--text2);border:1px solid var(--border);padding:10px 24px;border-radius:10px;cursor:pointer;font-size:14px">Cancelar</button>';
  h+='</div></div>';
  // Product list
  h+='<h3 style="color:var(--text1);margin-bottom:12px">Produtos Actuais ('+PRODUTOS.length+')</h3>';
  h+='<div style="display:flex;flex-direction:column;gap:8px">';
  PRODUTOS.forEach(function(p){
    var planStr=p.plans.map(function(pl){return pl.dur+": "+fmtMT(pl.preco);}).join(" | ");
    h+='<div style="display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px">';
    h+='<div style="width:32px;height:32px;flex-shrink:0">'+brandSvg(p.logo)+'</div>';
    h+='<div style="flex:1;min-width:0"><div style="font-weight:600;color:var(--text1);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.nome)+(p._custom?' <span style="color:#f59e0b;font-size:10px">CUSTOM</span>':'')+'</div>';
    h+='<div style="font-size:11px;color:var(--text2)">'+esc(p.categoria)+' — '+planStr+'</div></div>';
    h+='<button onclick="editAdminProduct(\''+p.id+'\')" style="background:var(--accent);color:#fff;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px">Editar</button>';
    if(p._custom) h+='<button onclick="deleteAdminProduct(\''+p.id+'\')" style="background:#ef4444;color:#fff;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px">Apagar</button>';
    h+='</div>';
  });
  h+='</div></div></div>';
  return h;
}

function addPlanRow(){
  var c=document.getElementById("adm-plans");
  if(!c)return;
  var d=document.createElement("div");
  d.style.cssText="display:flex;gap:8px;margin-top:6px;align-items:center";
  d.className="adm-plan-row";
  d.innerHTML='<input class="adm-plan-dur" placeholder="Nome (ex: Mensal)" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1)"><input class="adm-plan-preco" type="number" placeholder="Preço MT" style="width:100px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1)"><button onclick="this.parentElement.remove();" style="background:#ef4444;color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:16px">✕</button>';
  c.appendChild(d);
}

function saveAdminProduct(){
  var nome=document.getElementById("adm-nome").value.trim();
  var brand=document.getElementById("adm-brand").value.trim();
  var catSel=document.getElementById("adm-cat");
  var cat=catSel.value;
  if(cat==="__new__"){cat=prompt("Nome da nova categoria:");if(!cat)return;}
  var logo=document.getElementById("adm-logo").value;
  var stock=parseInt(document.getElementById("adm-stock").value)||9999;
  var tag=document.getElementById("adm-tag").value.trim();
  var desc=document.getElementById("adm-desc").value.trim();
  var feat=document.getElementById("adm-feat").value.split(",").map(function(f){return f.trim();}).filter(Boolean);
  var planRows=document.querySelectorAll(".adm-plan-row");
  var plans=[];
  planRows.forEach(function(r){
    var dur=r.querySelector(".adm-plan-dur").value.trim();
    var preco=parseInt(r.querySelector(".adm-plan-preco").value);
    if(dur&&preco>0) plans.push({dur:dur,preco:preco});
  });
  if(!nome){showToast("Preencha o nome!","⚠️");return;}
  if(plans.length<1){showToast("Adicione pelo menos 1 plano!","⚠️");return;}
  var ep=S.editProduct;
  var prod={
    id: ep?ep.id:("c"+Date.now()),
    nome:nome,brand:brand,logo:logo,categoria:cat,
    plans:plans,stock:stock,tag:tag,rating:4.5,sold:0,
    descricao:desc,features:feat,_custom:true
  };
  if(ep){
    var idx=PRODUTOS.findIndex(function(p){return p.id===ep.id;});
    if(idx>=0)PRODUTOS[idx]=prod;
  } else {
    PRODUTOS.push(prod);
  }
  // Refresh categories
  CATEGORIAS=["Todos"];
  PRODUTOS.forEach(function(p){if(CATEGORIAS.indexOf(p.categoria)<0)CATEGORIAS.push(p.categoria);});
  saveCustomProducts();
  S.editProduct=null;
  showToast(ep?"Produto actualizado!":"Produto adicionado!","✅");
  render();
}

function editAdminProduct(id){
  var p=PRODUTOS.find(function(x){return x.id===id;});
  if(p){S.editProduct=JSON.parse(JSON.stringify(p));S.editProduct._custom=true;render();}
}

function deleteAdminProduct(id){
  if(!confirm("Apagar este produto?"))return;
  PRODUTOS=PRODUTOS.filter(function(p){return p.id!==id;});
  CATEGORIAS=["Todos"];
  PRODUTOS.forEach(function(p){if(CATEGORIAS.indexOf(p.categoria)<0)CATEGORIAS.push(p.categoria);});
  saveCustomProducts();
  showToast("Produto removido!","🗑️");
  render();
}

loadCart();
render();

</script>
</body>
</html>
